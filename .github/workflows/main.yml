name: BeanStock Validacion

on:
  push:
    branches: [ "main", "master" ]

jobs:
  verificacion:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Validar sintaxis basica
      run: |
        python -m py_compile manage.py
        python -m py_compile microservicio.py
        python -m py_compile cliente.py